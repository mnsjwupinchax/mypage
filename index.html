<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>迷你世界 ID 查询</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%230F6FDE'/%3E%3Ctext x='12' y='17' font-size='13' font-family='monospace' fill='%23fff' text-anchor='middle'%3E%23%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#F1F3F5;
    --card:#FFFFFF;
    --ink:#191B20;
    --muted:#767D86;
    --line:#E3E6EA;
    --accent:#0F6FDE;
    --accent-bg:#E8F1FD;
    --sans:-apple-system,BlinkMacSystemFont,"HarmonyOS Sans SC","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:var(--sans);font-size:16px;line-height:1.5;
    padding-bottom:32px;
  }
  .shell{max-width:720px;margin:0 auto;padding:0 14px;}

  /* ---------- 顶部标题 ---------- */
  header{padding:20px 2px 12px;}
  h1{font-size:20px;margin:0 0 4px;letter-spacing:.01em;font-weight:600;}
  .sub{font-size:13px;color:var(--muted);margin:0;font-weight:400;}

  /* ---------- 搜索 ---------- */
  .search-wrap{
    position:sticky;top:0;z-index:20;
    background:var(--bg);padding:8px 0 10px;
  }
  .search{
    display:flex;align-items:center;gap:8px;
    background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:0 10px;height:46px;
  }
  .search svg{width:18px;height:18px;flex:0 0 18px;fill:none;stroke:var(--muted);stroke-width:1.8;}
  .search input{
    flex:1 1 auto;min-width:0;border:0;outline:0;background:transparent;
    font:inherit;font-size:16px;color:var(--ink);height:100%;
    padding:0;
  }
  .search input::placeholder{color:#A8AEB6;}
  .clear{
    border:0;background:transparent;color:var(--muted);font-size:20px;
    line-height:1;width:26px;height:26px;cursor:pointer;display:none;
    border-radius:50%;
  }
  .clear.on{display:block;}
  .clear:active{background:#EDEFF2;}

  /* ---------- 分类页签 ---------- */
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;border:1px solid var(--line);background:var(--card);
    color:#4A5058;font:inherit;font-size:14px;padding:8px 14px;border-radius:9px;
    cursor:pointer;white-space:nowrap;
  }
  .tab .cnt{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:5px;}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500;}
  .tab.on .cnt{color:#CFE2FB;}

  .chips{display:flex;gap:7px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:10px;scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;border:0;background:#E7EAEE;color:#4A5058;
    font:inherit;font-size:12.5px;padding:6px 11px;border-radius:20px;cursor:pointer;white-space:nowrap;
  }
  .chip.on{background:var(--accent-bg);color:var(--accent);font-weight:500;}

  /* ---------- 结果统计 ---------- */
  .meta{font-size:12.5px;color:var(--muted);padding:0 2px 8px;}
  .meta b{color:var(--ink);font-family:var(--mono);font-weight:500;}

  /* ---------- 结果列表 ---------- */
  .board{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    overflow:hidden;
  }
  .grid{display:grid;grid-template-columns:1fr 1fr;}
  .cell{
    display:flex;align-items:baseline;gap:8px;
    padding:12px 12px;border-bottom:1px solid var(--line);
    background:transparent;border-left:0;border-right:0;border-top:0;
    font:inherit;text-align:left;color:var(--ink);cursor:pointer;min-width:0;
  }
  .cell:nth-child(odd){border-right:1px solid var(--line);}
  .cell:active{background:var(--accent-bg);}
  .cell .id{
    flex:0 0 auto;font-family:var(--mono);font-size:12.5px;font-weight:600;
    color:var(--accent);background:var(--accent-bg);padding:1px 6px;border-radius:5px;
  }
  .cell .nm{
    flex:1 1 auto;min-width:0;font-size:14.5px;line-height:1.35;
    overflow-wrap:anywhere;
  }
  .cell .ct{flex:0 0 auto;font-size:10.5px;color:#98A0A9;}
  .empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:14px;}

  .more{
    display:block;width:100%;border:1px solid var(--line);border-top:0;
    background:var(--card);color:var(--accent);font:inherit;font-size:14px;
    padding:13px;cursor:pointer;
  }
  .more:active{background:var(--accent-bg);}

  /* ---------- 提示条 ---------- */
  .toast{
    position:fixed;left:50%;bottom:34px;transform:translate(-50%,14px);
    background:#1B1E24;color:#fff;font-size:13px;padding:9px 16px;border-radius:20px;
    opacity:0;transition:opacity .2s ease,transform .2s ease;pointer-events:none;z-index:40;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  /* ---------- 详情面板 ---------- */
  .mask{
    position:fixed;inset:0;background:rgba(20,22,26,.42);
    opacity:0;visibility:hidden;transition:opacity .22s ease;z-index:50;
  }
  .mask.open{opacity:1;visibility:visible;}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:51;
    background:var(--card);border-radius:16px 16px 0 0;
    transform:translateY(101%);transition:transform .26s cubic-bezier(.32,.72,.28,1);
    max-height:82vh;overflow-y:auto;padding:0 18px 26px;
    box-shadow:0 -8px 30px rgba(18,20,24,.14);
  }
  .sheet.open{transform:translateY(0);}
  .sheet .grab{width:38px;height:4px;background:#D7DCE1;border-radius:2px;margin:9px auto 14px;}
  .sheet h2{font-size:19px;margin:0 0 6px;font-weight:600;line-height:1.35;}
  .sheet .sid{
    display:inline-flex;align-items:center;gap:6px;
    font-family:var(--mono);font-size:13px;color:var(--accent);
    background:var(--accent-bg);padding:3px 9px;border-radius:6px;margin-bottom:16px;
  }
  .kv{border-top:1px solid var(--line);padding:11px 0;display:flex;gap:12px;}
  .kv .k{flex:0 0 68px;font-size:13px;color:var(--muted);}
  .kv .v{flex:1 1 auto;font-size:14px;min-width:0;overflow-wrap:anywhere;}
  .kv .v code{font-family:var(--mono);font-size:12.5px;background:#F2F4F6;padding:1px 5px;border-radius:4px;}
  .sheet .hint{
    background:#F6F7F9;color:#5E656D;font-size:13px;line-height:1.7;
    padding:11px 12px;border-radius:9px;margin-top:6px;
  }
  .sheet .acts{display:flex;gap:10px;margin-top:16px;}
  .sheet .acts button{
    flex:1 1 0;font:inherit;font-size:14px;padding:11px;border-radius:9px;cursor:pointer;
    border:1px solid var(--line);background:var(--card);color:var(--ink);
  }
  .sheet .acts .primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500;}

  footer{margin-top:22px;font-size:12px;color:var(--muted);line-height:1.85;padding:0 2px;}
  footer a{color:var(--muted);}

  @media (max-width:360px){
    .grid{grid-template-columns:1fr;}
    .cell:nth-child(odd){border-right:0;}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;}
  }
</style>
</head>
<body>
<div class="shell">

  <header>
    <h1>迷你世界 ID 查询</h1>
    <p class="sub">输入数字查名字，输入名字查 ID · 点按复制，长按看详情</p>
  </header>

  <div class="search-wrap">
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>

      <button class="clear" id="clear" aria-label="清空">×</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
    <div class="chips" id="chips"></div>
    <div class="meta" id="meta"></div>
  </div>

  <div class="board">
    <div class="grid" id="grid"></div>
  </div>
  <button class="more" id="more" style="display:none">显示更多</button>

  <footer>
    数据来源：迷你世界官方开发者文档「方块表 / 道具表 / 生物表」（developers.mini1.cn，2023-05-09 版）。<br>
    ID 2、7、10、16、20、21、22 属于旧版本方块，官方现行表未收录，按旧版对照补充；官方未公开皮肤 ID 表，故未收录。
  </footer>
</div>

<div class="toast" id="toast" aria-live="polite"></div>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="grab"></div>
  <div id="sheetBody"></div>
</div>

const grid = document.getElementById("grid");
const meta = document.getElementById("meta");
const moreBtn = document.getElementById("more");
const tabsEl = document.getElementById("tabs");
const chipsEl = document.getElementById("chips");
const input = document.getElementById("q");
const clearBtn = document.getElementById("clear");
const toast = document.getElementById("toast");

/* ---------- 页签 ---------- */
function buildTabs(){
  const mk = (label, count, idx) =>
    `<button class="tab${idx===curTab?" on":""}" data-tab="${idx}">${label}<span class="cnt">${count}</span></button>`;
  tabsEl.innerHTML = mk("全部", TOTAL, -1) +
    TABS.map((t,i) => mk(t.name, t.count, i)).join("");
}
tabsEl.addEventListener("click", e => {
  const b = e.target.closest(".tab"); if(!b) return;
  curTab = +b.dataset.tab; curCat = -1; shown = STEP;
  buildTabs(); buildChips(); render();
});

/* ---------- 类目 ---------- */
function buildChips(){
  const cats = curTab < 0 ? [] : TABS[curTab].cats;
  if(!cats.length){ chipsEl.innerHTML = ""; return; }
  chipsEl.innerHTML =
    `<button class="chip${curCat===-1?" on":""}" data-cat="-1">全部</button>` +
    cats.map((c,i)=>`<button class="chip${curCat===i?" on":""}" data-cat="${i}">${c}</button>`).join("");
}
chipsEl.addEventListener("click", e => {
  const b = e.target.closest(".chip"); if(!b) return;
  curCat = +b.dataset.cat; shown = STEP; buildChips(); render();
});

/* ---------- 查询 ---------- */
function sourceRows(){
  if(curTab < 0) return ALL.rows;
  const t = TABS[curTab];
  return t.rows.map(r => [r[0], r[1], r[2], curTab]);
}

let timer = null;
input.addEventListener("input", () => {
  clearBtn.classList.toggle("on", input.value.length > 0);
  clearTimeout(timer);
  timer = setTimeout(() => { query = input.value.trim(); shown = STEP; render(); }, 120);
});
clearBtn.addEventListener("click", () => {
  input.value = ""; query = ""; shown = STEP;
  clearBtn.classList.remove("on"); input.focus(); render();
});

function results(){
  const q = query.toLowerCase();
  let rows = sourceRows();
  if(curCat >= 0) rows = rows.filter(r => r[2] === curCat);

  if(!q) return rows.slice().sort((a,b) => a[0] - b[0]);

  // 纯数字：只返回 ID 完全相等的那一条，不再列出包含该数字的结果
  if(/^\d+$/.test(q)){
    return rows.filter(r => String(r[0]) === q);
  }

  const scored = [];
  for(const r of rows){
    const name = r[1].toLowerCase();
    let s = -1;
    if(name === q) s = 0;
    else if(name.startsWith(q)) s = 2;
    else if(name.includes(q)) s = 3;
    if(s >= 0) scored.push([s, r]);
  }
  scored.sort((a,b) => a[0] - b[0] || a[1][0] - b[1][0]);
  return scored.map(x => x[1]);
}

/* ---------- 渲染 ---------- */
function render(){
  const list = results();
  const slice = list.slice(0, shown);

  meta.innerHTML = list.length
    ? `共 <b>${list.length}</b> 条${list.length>shown?`，已显示 <b>${slice.length}</b>`:""}`
    : "";

  if(!list.length){
    const isNum = /^\d+$/.test(query);
    if(isNum){
      const v = +query;
      const base = sourceRows();
      const lower = base.filter(r => r[0] < v).sort((a,b)=>b[0]-a[0]).slice(0,2);
      const higher = base.filter(r => r[0] > v).sort((a,b)=>a[0]-b[0]).slice(0,2);
      const others = [];
      TABS.forEach((t, ti) => {
        if(ti === curTab) return;
        t.rows.forEach(r => { if(r[0] === v) others.push(`${t.name} · ${r[1]}`); });
      });
      const near = [...lower.reverse(), ...higher].map(r => `${r[0]} ${escapeHTML(r[1])}`).join("　");
      grid.innerHTML = `<div class="empty">
        当前表里没有 ID <b>${escapeHTML(query)}</b>
        ${others.length ? `<br>其它页签里有：${others.map(escapeHTML).join("、")}` : ""}
        ${near ? `<br>附近 ID：${near}` : ""}
      </div>`;
    } else {
      grid.innerHTML = `<div class="empty">没找到「${escapeHTML(query)}」<br>换个关键词，或换个页签试试</div>`;
    }
    grid.style.gridTemplateColumns = "1fr";
    moreBtn.style.display = "none";
    return;
  }
  grid.style.gridTemplateColumns = "";

  const showCat = curTab < 0;
  const html = slice.map(r => {
    const catLabel = showCat ? TABS[r[3]].name + (TABS[r[3]].cats.length>1 ? "·"+TABS[r[3]].cats[r[2]] : "") : "";
    return `<button class="cell" data-id="${r[0]}" data-name="${escapeAttr(r[1])}" data-t="${r[3]}" data-c="${r[2]}">
      <span class="id">${r[0]}</span>
      <span class="nm">${escapeHTML(r[1])}</span>
      ${showCat?`<span class="ct">${escapeHTML(catLabel)}</span>`:""}
    </button>`;
  }).join("");
  grid.innerHTML = html;

  moreBtn.style.display = list.length > shown ? "block" : "none";
  moreBtn.textContent = `显示更多（还有 ${list.length - shown} 条）`;
}

moreBtn.addEventListener("click", () => { shown += STEP; render(); });

/* ---------- 点击复制 / 长按详情 ---------- */
const DOC = [
  "https://developers.mini1.cn/wiki/data_files/blockdef.html",
  "https://developers.mini1.cn/wiki/data_files/itemdef.html",
  "https://developers.mini1.cn/wiki/data_files/creaturedef.html",
  "https://developers.mini1.cn/wiki/data_files/creaturedef.html"
];
const VARNAME = ["blockid", "itemid", "actorid", "actorid"];

let pressTimer = null, longPressed = false, sx = 0, sy = 0;

grid.addEventListener("pointerdown", e => {
  const cell = e.target.closest(".cell"); if(!cell) return;
  sx = e.clientX; sy = e.clientY; longPressed = false;
  clearTimeout(pressTimer);
  pressTimer = setTimeout(() => {
    longPressed = true;
    openSheet(cell);
  }, 460);
});

["pointerup","pointercancel","pointerleave"].forEach(ev =>
  grid.addEventListener(ev, () => clearTimeout(pressTimer))
);
grid.addEventListener("pointermove", e => {
  if(Math.abs(e.clientX - sx) > 12 || Math.abs(e.clientY - sy) > 12) clearTimeout(pressTimer);
});
grid.addEventListener("contextmenu", e => e.preventDefault());

grid.addEventListener("click", e => {
  const cell = e.target.closest(".cell"); if(!cell) return;
  if(longPressed){ longPressed = false; return; }
  const id = cell.dataset.id, name = cell.dataset.name;
  copyText(id).then(ok => showToast(ok ? `已复制 ${id}（${name}）` : `复制失败，请长按选择 ${id}`));
});

/* ---------- 详情面板 ---------- */
const mask = document.getElementById("mask");
const sheet = document.getElementById("sheet");
const sheetBody = document.getElementById("sheetBody");
let sheetCell = null;

function openSheet(cell){
  sheetCell = cell;
  const id = cell.dataset.id, name = cell.dataset.name;
  const ti = +cell.dataset.t, ci = +cell.dataset.c;
  const tab = TABS[ti];
  const catName = tab.cats.length > 1 ? tab.cats[ci] : "—";

  sheetBody.innerHTML = `
    <h2 id="sheetTitle">${escapeHTML(name)}</h2>
    <span class="sid">ID ${id}</span>
    <div class="kv"><span class="k">所属表</span><span class="v">${tab.name}</span></div>
    <div class="kv"><span class="k">分类</span><span class="v">${escapeHTML(catName)}</span></div>
    <div class="kv"><span class="k">脚本里用</span><span class="v"><code>local ${VARNAME[ti]} = ${id}</code></span></div>
    <div class="kv"><span class="k">物品介绍</span><span class="v">官方数据表未收录</span></div>
    <div class="kv"><span class="k">获取方式</span><span class="v">官方数据表未收录</span></div>
    <div class="hint">官方开发者文档的这张表只登记了「ID + 名称」两项，没有介绍和获取途径。查到 ID 后，可以到游戏内「编辑框 → 插入ID」或下方官方文档核对。</div>
    <div class="kv"><span class="k">官方文档</span><span class="v"><a href="${DOC[ti]}" target="_blank" rel="noopener noreferrer">${tab.name}表数据 ↗</a></span></div>
    <div class="acts">
      <button class="primary" id="sheetCopy">复制 ID ${id}</button>
      <button id="sheetClose">关闭</button>
    </div>
  `;
  mask.classList.add("open");
  sheet.classList.add("open");
  document.body.style.overflow = "hidden";

  document.getElementById("sheetCopy").addEventListener("click", () => {
    copyText(id).then(ok => showToast(ok ? `已复制 ${id}` : "复制失败"));
  });
  document.getElementById("sheetClose").addEventListener("click", closeSheet);
}

function closeSheet(){
  mask.classList.remove("open");
  sheet.classList.remove("open");
  document.body.style.overflow = "";
}
mask.addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if(e.key === "Escape") closeSheet(); });

function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text).then(()=>true).catch(()=>fallback());
  }
  return Promise.resolve(fallback());
  function fallback(){
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try{ ok = document.execCommand("copy"); }catch(err){ ok = false; }
    document.body.removeChild(ta);
    return ok;
  }
}

let toastTimer = null;
function showToast(msg){
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toast.classList.remove("show"), 1800);
}

function escapeHTML(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function escapeAttr(s){ return escapeHTML(s); }

/* ---------- 启动 ---------- */
buildTabs(); buildChips(); shown = STEP; render();
window.addEventListener("resize", () => { /* 布局自适应交给 CSS */ });
</script>
</body>
</html>
